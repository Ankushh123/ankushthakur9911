        <style>
            h1{
                color: rgba(16, 226, 241, 0.164);

            }
            .img{
                position: absolute;
                top: 30%;
                height: 65%;
                width: 48%;
                border: 2px solid black;
                border-radius: 10px;
                transition: 2s ease-in-out;

            .img:hover{

            }

                background-image: radial-gradient(blue,green);

                flex: wrap;
            }
            a{
                text-decoration: none;
                color: blueviolet;
                margin: 10px;
            }
            div{
                display: flex;
                align-items: center;
                text-align: center;
                position: absolute;
                top: 1%;
                left: 80%;
                width: 28%;
            }
            a:hover{
                color: aqua;
            }
            p1{
                position: absolute;
                top: 20%;
                left: 32%;
            }
            .img1{
                position: absolute;
                top: 30%;

                border-radius: 10px;

            .img1:hover{
                transform: scale(0.9,0.9);
            }
            img{
                position: absolute;
                top: 100%;
                height: 80%;
                width: 98.5%;
            }
